[[mods]]
modId="golem_logix"
version="${mod_version}"
displayName="Golem Logix"
logoFile="logo.png"
authors="NiceClown"
credits="Occult-analog style, runes and everything else drawn by code."
description='''
Cold, occult, analog logistics for Minecraft 26.1.2: a storage network with channels and an Atlas Array multiblock,
2x2 copper drive cabinets with cassette disks, glass frost pipes with running snowmen, buses, terminals and
autocrafting on punch cards. The network runs on Source: Ars Nouveau's, or Cryo-Source distilled from Neo Vitae blood
(with neither installed it needs no Source at all). Includes an in-game guide book in English and Russian.
'''

