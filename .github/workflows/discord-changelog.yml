name: Discord Latest Release Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (leave blank for latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  post-changelog:
    # When paired 26.1.2 + 1.21.1 releases publish together, post the changelog once
    if: ${{ github.event_name == 'workflow_dispatch' || !endsWith(github.event.release.tag_name, '-mc-1.21.1') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Post latest release changelog to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_CHANGELOG_WEBHOOK", "").strip()
          if not webhook:
              print("ERROR: DISCORD_CHANGELOG_WEBHOOK secret is not set.", file=sys.stderr)
              sys.exit(1)

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          input_tag = os.environ.get("INPUT_TAG", "").strip()

          def gh_get(path: str):
              req = urllib.request.Request(f"https://api.github.com{path}")
              req.add_header("Accept", "application/vnd.github+json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          title = ""
          tag = ""
          release_url = f"https://github.com/{repo}/releases"
          body = ""

          if event_name == "release" and event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as f:
                  rel = json.load(f).get("release", {})
              title = (rel.get("name") or rel.get("tag_name") or "").strip()
              tag = (rel.get("tag_name") or "").strip()
              release_url = rel.get("html_url") or release_url
              body = (rel.get("body") or "").strip()
          else:
              rel = None
              if input_tag:
                  rel = gh_get(f"/repos/{repo}/releases/tags/{input_tag}")
              else:
                  releases = gh_get(f"/repos/{repo}/releases?per_page=10")
                  non_draft = [r for r in releases if not r.get("draft")]
                  preferred = [r for r in non_draft if not str(r.get("tag_name", "")).endswith("-mc-1.21.1")]
                  rel = (preferred or non_draft or [None])[0]
              if rel:
                  title = (rel.get("name") or rel.get("tag_name") or "").strip()
                  tag = (rel.get("tag_name") or "").strip()
                  release_url = rel.get("html_url") or release_url
                  body = (rel.get("body") or "").strip()

          if not body and os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  lines = f.read().splitlines()
              capturing = False
              section = []
              for line in lines:
                  if re.match(r"^##\s+", line):
                      if capturing:
                          break
                      capturing = True
                      if not title:
                          title = re.sub(r"^##\s+", "", line).strip()
                      continue
                  if capturing:
                      section.append(line)
              body = "\n".join(section).strip()

          body = body.replace("\r\n", "\n").strip()
          # Strip redundant top heading if it repeats the title
          body = re.sub(r"^#{1,3}\s+Golem Logix[^\n]*\n+", "", body)
          # Convert ### / ## headings into crisp bold Discord section titles
          body = re.sub(r"(?m)^###\s+(.+)$", r"**\1**", body)
          body = re.sub(r"(?m)^##\s+(.+)$", r"**\1**", body)
          body = re.sub(r"\n{3,}", "\n\n", body).strip()

          if not title:
              title = f"Golem Logix {tag or 'Release'}"

          # Split cleanly on line boundaries so each Discord embed stays <= 3800 chars
          MAX_LEN = 3800
          chunks = []
          current = []
          cur_len = 0
          for line in body.splitlines():
              add_len = len(line) + (1 if current else 0)
              if cur_len + add_len > MAX_LEN and current:
                  chunks.append("\n".join(current))
                  current = [line]
                  cur_len = len(line)
              else:
                  current.append(line)
                  cur_len += add_len
          if current:
              chunks.append("\n".join(current))
          if not chunks:
              chunks = ["Release published on GitHub."]

          links_line = f"\n\n🔗 [GitHub Release]({release_url}) · [CurseForge](https://www.curseforge.com/minecraft/mc-mods/golem-logix)"
          if len(chunks[-1]) + len(links_line) <= 4000:
              chunks[-1] += links_line
          else:
              chunks.append(links_line.strip())

          embeds = []
          for idx, chunk in enumerate(chunks):
              emb = {
                  "description": chunk,
                  "color": 0xC89B3C,
              }
              if idx == 0:
                  emb["title"] = f"📦 {title}"[:256]
                  emb["url"] = release_url
              if idx == len(chunks) - 1:
                  emb["footer"] = {"text": f"Golem Logix • {tag or 'Latest Release'}"}
              embeds.append(emb)

          # Send embeds in batches staying well under Discord's 6000-char total embed limit per message
          batches = []
          cur_batch = []
          cur_chars = 0
          for emb in embeds:
              emb_chars = len(emb.get("title", "")) + len(emb.get("description", "")) + len(emb.get("footer", {}).get("text", ""))
              if cur_batch and (cur_chars + emb_chars > 5500 or len(cur_batch) >= 10):
                  batches.append(cur_batch)
                  cur_batch = [emb]
                  cur_chars = emb_chars
              else:
                  cur_batch.append(emb)
                  cur_chars += emb_chars
          if cur_batch:
              batches.append(cur_batch)

          for b_idx, batch in enumerate(batches):
              payload = {
                  "username": "Golem Logix Releases",
                  "embeds": batch,
              }
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "GolemLogix-GitHub-Action/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f"Batch {b_idx + 1}/{len(batches)}: Discord HTTP {resp.status} for '{title}'.")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  print(f"ERROR: Discord HTTP {e.code}: {err_body}", file=sys.stderr)
                  sys.exit(1)
          PY
