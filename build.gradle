plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.5-beta'
}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = 'com.golemlogix'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
}

base {
    archivesName = 'golem_logix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // build and test against a recent 21.1.x: current Ars Nouveau and JEI work with it (the mod also runs on older 21.1)
    version = '21.1.256'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'golem_logix'
        }

        // developer screenshot rig: the client creates a world itself and takes shots from the scenarios in run/devshots/queue
        devShots {
            client()
            gameDirectory = file('run/devshots')
            systemProperty 'golemlogix.devshots', file('run/devshots/queue').getAbsolutePath()
            // network mode of the rig: gradle -PdevshotsServer=localhost:25565 runDevShots (the client joins a dedicated server)
            if (project.hasProperty('devshotsServer')) {
                systemProperty 'golemlogix.devshots.server', project.property('devshotsServer').toString()
            }
            // a generated world instead of the flat one: gradle -PdevshotsWorld=normal:<seed> runDevShots
            if (project.hasProperty('devshotsWorld')) {
                systemProperty 'golemlogix.devshots.world', project.property('devshotsWorld').toString()
            }
            // the window size: gradle -PdevshotsSize=1920x1080 runDevShots (default 1280x720)
            def size = (project.findProperty('devshotsSize') ?: '1280x720').toString().split('x')
            programArguments.addAll '--width', size[0], '--height', size[1]
        }

        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'golem_logix'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'golem_logix'
        }

        data {
            data()
            programArguments.addAll '--mod', 'golem_logix', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        golem_logix {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // optional integrations: compiled against their APIs, picked up in game only when installed
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.44.0.403'
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    // Curios: the Portable Chronometer's own slot (integration/curios, used only when Curios is loaded)
    compileOnly 'maven.modrinth:curios:yohfFbgD'                    // 9.5.1+1.21.1
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    // Modrinth version ids, not version numbers: the same number sometimes has Fabric builds.
    // Copper Age Backport is optional (it brings the copper golem for the anvil ritual; modpacks may use another golem or their own
    // recipes). It is in every dev run unless -PnoBackport checks the mod without it.
    if (!project.hasProperty('noBackport')) {
        runtimeOnly 'maven.modrinth:backport-copper-age:ZyjDScTQ'  // 1.21.1-0.1.5.1-pre neoforge
    }

    // testing with the real mods in dev runs: gradle -PtestMods runClient / runDevShots / runGameTestServer
    // (Source from Ars Nouveau jars, JEI, Jade). They do not go into the release jar.
    if (project.hasProperty('testMods')) {
        runtimeOnly 'maven.modrinth:ars-nouveau:yWDnir1o'          // 5.13.3
        runtimeOnly 'maven.modrinth:geckolib:Grwn5rUB'             // 4.9.3 neoforge
        runtimeOnly 'maven.modrinth:curios:yohfFbgD'               // 9.5.1+1.21.1
        runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.44.0.403'
        runtimeOnly 'maven.modrinth:jade:15.10.6+neoforge'
    }
    // compatibility with fluids of big mods: gradle -Pmekanism ... (Mekanism buckets and tanks in the Interface)
    if (project.hasProperty('mekanism')) {
        runtimeOnly 'maven.modrinth:mekanism:5KzzycBT'             // 10.7.19.85 (1.21.1 neoforge)
    }
    // Create recipes (mixing with liquid cryo-source, pressing torn minds): gradle -Pcreate ...
    if (project.hasProperty('create')) {
        runtimeOnly 'maven.modrinth:create:UjX6dr61'               // 6.0.10 (1.21.1 neoforge, bundles Flywheel and Ponder)
    }
    // side by side with Applied Energistics 2 in dev runs: gradle -Pae2 ...
    if (project.hasProperty('ae2')) {
        runtimeOnly 'maven.modrinth:ae2:KDnFUmMm'                  // 19.2.18 (1.21.1 neoforge)
        runtimeOnly 'maven.modrinth:guideme:hFpGwC6q'              // 21.1.19, required by AE2
    }
}

test {
    useJUnitPlatform()
}

// game tests are only needed for runGameTestServer (it takes classes from build/classes, not from the jar)
tasks.named('jar') {
    exclude 'com/golemlogix/gametest/**'
    exclude 'com/golemlogix/devtest/**'
    exclude 'data/golem_logix/structure/**'
    manifest {
        attributes(
                'Implementation-Title': 'Golem Logix',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'NiceClown',
                'Specification-Title': 'golem_logix',
                'Specification-Version': project.version
        )
    }
}

// the version in neoforge.mods.toml comes from gradle (${mod_version})
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
